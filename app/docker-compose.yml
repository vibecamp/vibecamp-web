services:
    db:
        image: postgres:15-alpine
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: vibecamp
        volumes:
            - dbdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d vibecamp']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    dbdata: {}
